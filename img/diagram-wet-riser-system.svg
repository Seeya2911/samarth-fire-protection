<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
  <title id="t">How a wet riser fire hydrant system works</title>
  <desc id="d">Schematic: underground water tank feeds main electric pump, standby diesel pump and jockey pump; water flows into a permanently charged wet riser with a landing valve and hose on every floor, plus a fire brigade inlet and terrace tank.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
    .h{font-weight:700;font-size:14px}.s{font-size:12px;fill:#475569}.w{font-size:12px;fill:#fff;font-weight:700}
  </style>
  <rect width="800" height="560" fill="#fff"/>
  <text x="24" y="34" class="h" style="font-size:20px">Wet riser hydrant system — the basic layout</text>
  <rect x="470" y="70" width="190" height="400" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <rect x="490" y="48" width="150" height="34" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="565" y="70" class="h" text-anchor="middle">Terrace tank</text>
  <rect x="528" y="82" width="12" height="388" fill="#dc2626"/>
  <text x="520" y="340" class="s" transform="rotate(-90 520 340)">wet riser (always full)</text>
  <g stroke="#cbd5e1" stroke-width="2"><line x1="470" y1="170" x2="660" y2="170"/><line x1="470" y1="260" x2="660" y2="260"/><line x1="470" y1="350" x2="660" y2="350"/></g>
  <g fill="#dc2626"><rect x="540" y="146" width="40" height="8" rx="3"/><rect x="540" y="236" width="40" height="8" rx="3"/><rect x="540" y="326" width="40" height="8" rx="3"/><rect x="540" y="416" width="40" height="8" rx="3"/></g>
  <g class="s"><text x="592" y="152">Landing valve + hose, upper floor</text><text x="592" y="242">Landing valve + hose, floor 2</text><text x="592" y="332">Landing valve + hose, floor 1</text><text x="592" y="422">Landing valve + hose, ground</text></g>
  <rect x="676" y="440" width="100" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="726" y="457" class="h" text-anchor="middle" style="font-size:12px">Fire brigade</text><text x="726" y="472" class="h" text-anchor="middle" style="font-size:12px">inlet</text>
  <line x1="676" y1="458" x2="540" y2="458" stroke="#d97706" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="24" y="360" width="280" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="40" y="384" class="h">Pump room</text>
  <g><rect x="40" y="398" width="76" height="38" rx="6" fill="#ea580c"/><text x="78" y="414" class="w" text-anchor="middle">Main pump</text><text x="78" y="428" class="w" text-anchor="middle" style="font-size:10px">electric</text>
  <rect x="124" y="398" width="76" height="38" rx="6" fill="#b45309"/><text x="162" y="414" class="w" text-anchor="middle">Standby</text><text x="162" y="428" class="w" text-anchor="middle" style="font-size:10px">diesel</text>
  <rect x="208" y="398" width="76" height="38" rx="6" fill="#0369a1"/><text x="246" y="414" class="w" text-anchor="middle">Jockey</text><text x="246" y="428" class="w" text-anchor="middle" style="font-size:10px">keeps pressure</text></g>
  <rect x="40" y="452" width="500" height="12" fill="#dc2626"/><text x="40" y="490" class="s">Controller panel starts pumps when pressure drops</text>
  <rect x="24" y="130" width="230" height="170" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="40" y="156" class="h">Underground static tank</text>
  <path d="M24 215 q29 -14 58 0 t58 0 t58 0 t58 0 V290 a10 10 0 0 1 -10 10 H34 a10 10 0 0 1 -10 -10 Z" fill="#93c5fd"/>
  <text x="40" y="262" class="s" style="fill:#1e3a8a">Dedicated fire-water reserve</text>
  <line x1="139" y1="300" x2="139" y2="360" stroke="#2563eb" stroke-width="4"/>
  <text x="24" y="540" class="s">Illustrative only — actual design, pump duty and tank capacity come from the approved fire plan. © Samarth Fire Protection System</text>
</svg>