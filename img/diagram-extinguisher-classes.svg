<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">Which fire extinguisher for which fire class</title>
  <desc id="d">Chart showing fire classes A, B, C, D and F/K with typical fuels and suitable extinguisher types: water, foam, ABC dry powder, CO2, wet chemical.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
    .h{font-weight:700;font-size:15px}.s{font-size:13px;fill:#475569}.b{font-weight:700;font-size:26px;fill:#fff}
    .ok{font-weight:700;font-size:13px;fill:#047857}.no{font-weight:700;font-size:13px;fill:#b91c1c}
  </style>
  <rect width="800" height="500" fill="#fff"/>
  <text x="24" y="38" class="h" style="font-size:20px">Match the extinguisher to the fire</text>
  <text x="24" y="60" class="s">Always confirm against the label on the cylinder and your building’s approved fire plan.</text>
  <g transform="translate(24,80)">
    <rect width="752" height="64" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><rect width="64" height="64" rx="12" fill="#dc2626"/><text x="32" y="42" class="b" text-anchor="middle">A</text>
    <text x="80" y="26" class="h">Ordinary solids — wood, paper, cloth, plastics</text><text x="80" y="48" class="s">Water · Foam · ABC dry powder</text>
    <text x="740" y="26" class="ok" text-anchor="end">Water is effective</text><text x="740" y="48" class="s" text-anchor="end">Cools the burning fuel</text>
  </g>
  <g transform="translate(24,156)">
    <rect width="752" height="64" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><rect width="64" height="64" rx="12" fill="#2563eb"/><text x="32" y="42" class="b" text-anchor="middle">B</text>
    <text x="80" y="26" class="h">Flammable liquids — petrol, diesel, paint, solvents</text><text x="80" y="48" class="s">Foam · ABC dry powder · CO₂</text>
    <text x="740" y="26" class="no" text-anchor="end">Never use a water jet</text><text x="740" y="48" class="s" text-anchor="end">Spreads burning liquid</text>
  </g>
  <g transform="translate(24,232)">
    <rect width="752" height="64" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><rect width="64" height="64" rx="12" fill="#059669"/><text x="32" y="42" class="b" text-anchor="middle">C</text>
    <text x="80" y="26" class="h">Gases — LPG, PNG, methane</text><text x="80" y="48" class="s">ABC dry powder (stop the gas supply first)</text>
    <text x="740" y="26" class="no" text-anchor="end">Isolate the supply</text><text x="740" y="48" class="s" text-anchor="end">Do not extinguish a leaking flame</text>
  </g>
  <g transform="translate(24,308)">
    <rect width="752" height="64" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><rect width="64" height="64" rx="12" fill="#7c3aed"/><text x="32" y="42" class="b" text-anchor="middle">D</text>
    <text x="80" y="26" class="h">Combustible metals — magnesium, aluminium, sodium</text><text x="80" y="48" class="s">Special metal-fire powder only</text>
    <text x="740" y="26" class="no" text-anchor="end">No water, no CO₂</text><text x="740" y="48" class="s" text-anchor="end">Industrial / specialist risk</text>
  </g>
  <g transform="translate(24,384)">
    <rect width="752" height="64" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><rect width="64" height="64" rx="12" fill="#ea580c"/><text x="32" y="42" class="b" text-anchor="middle">F/K</text>
    <text x="80" y="26" class="h">Cooking oils and fats — commercial kitchens</text><text x="80" y="48" class="s">Wet chemical extinguisher</text>
    <text x="740" y="26" class="no" text-anchor="end">Never use water</text><text x="740" y="48" class="s" text-anchor="end">Switch off fuel / gas if safe</text>
  </g>
  <text x="24" y="478" class="s">Live electrical equipment: isolate power if safe, then use CO₂ or dry powder — never water.</text>
</svg>